gray0='#a6b0a0'
gray1='#939f91'
gray2='#829181'

# Semantic
set -g @text_main "$fg"
set -g @text_secondary "$gray1"
set -g @text_strong "$bg0"
set -g @text_active $green
set -g @text_accent $purple
set -g @text_tertiary $red
set -g @text_selected $orange
set -g @text_unselected_recent $gray1
