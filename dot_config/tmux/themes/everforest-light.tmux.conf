# Theme: Everforest light, medium (the iTerm Everforest profile's light colours). Dark twin: everforest-dark.
bg_dim='#efebd4'
bg0='#fdf6e3'
bg1='#f4f0d9'
bg2='#efebd4' # terminal bg color
bg3='#e6e2cc'
bg4='#e0dcc7'
bg5='#bdc3af'
bg_red="#fde3da"
bg_visual="#eaedc8"
bg_yellow="#faedcd"
bg_green="#f0f1d2"
bg_blue="#e9f0e9"
red="#f85552"
orange="#f57d26"
yellow="#dfa000"
green='#8da101'
blue="#3a94c5"
aqua="#35a77c"
purple="#df69ba"
fg='#5c6a72'
