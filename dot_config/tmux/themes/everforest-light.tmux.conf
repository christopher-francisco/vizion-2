set -g @bg_secondary "$purple"
set -g @bg_tertiary "$blue"
set -g @bg_selected "$orange"
set -g @bg_unselected_recent "$bg_yellow"
set -g @bg_unselected "$bg_blue"
set -g @border_active "$purple"
set -g @border_inactive "$bg1"
